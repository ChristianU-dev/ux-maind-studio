[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-maind"
version = "0.5.6"
description = "Local, source-grounded UX study inspector"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docling==2.150.0",
  "docling-slim[format-opendocument]==2.150.0",
  "docling-core==2.106.0",
  "docling-graph==1.9.2",
  "pydantic==2.14.1",
  "litellm==1.106.6",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.scripts]
ux-maind = "ux_maind.app.studio:main"

[tool.setuptools.packages.find]
include = ["ux_maind.app"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"ux_maind.app" = ["web/*.html", "web/*.css", "web/*.js", "web/generated/*", "web/generated/**/*"]
