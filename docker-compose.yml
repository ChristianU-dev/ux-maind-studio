services:
  ux-maind-studio:
    build: .
    container_name: ux-maind-studio
    ports:
      - "127.0.0.1:8465:8465"
    volumes:
      - ux_maind_workspace:/data/workspace
    environment:
      - LLMAPI_KEY=${LLMAPI_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_TRIAL_KEY=${GEMINI_TRIAL_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - UX_MAIND_OIDC_CLIENT_ID=${UX_MAIND_OIDC_CLIENT_ID:-}
      - UX_MAIND_OIDC_CLIENT_SECRET=${UX_MAIND_OIDC_CLIENT_SECRET:-}
      - UX_MAIND_OIDC_ISSUER=${UX_MAIND_OIDC_ISSUER:-https://accounts.google.com}
    restart: unless-stopped

volumes:
  ux_maind_workspace:
