<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" width="1560" height="800">

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #475569; }
      .lane-title { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.04em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; ry: 10; }
      .box-teal { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-sky { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-emerald { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.9; rx: 10; ry: 10; }
      .box-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; rx: 10; ry: 10; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 14; ry: 14; }
      .box-head { font: 700 13.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .box-code { font: 600 11.5px Consolas, 'JetBrains Mono', monospace; fill: #0f766e; }
      .box-text { font: 400 12px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
      .badge { font: 700 10.5px Consolas, monospace; fill: #ffffff; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-teal { stroke: #0d9488; stroke-width: 2.0; fill: none; marker-end: url(#arrow-teal); }
      .edge-amber { stroke: #d97706; stroke-width: 1.9; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-amber); }
      .edge-ext { stroke: #0284c7; stroke-width: 2.1; stroke-dasharray: 8 4; fill: none; marker-end: url(#arrow-sky); }
      .edge-file { stroke: #7c3aed; stroke-width: 2.4; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrow-violet); }
      .edge-label { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
      .legend-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; ry: 8; }
      .legend-txt { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="800" class="bg" />
  <text x="32" y="42" class="title">Moduldiagramm 07 — Dauerhafter Arbeitsordner, Altbestands-Übernahme &amp; 4-Stufen-Zweitprüfung</text>
  <text x="32" y="65" class="subtitle">Identischer lokaler Prüf- und Verblindungsablauf für ‚Am selben Rechner‘ und ‚Auf zwei Rechnern‘ ohne Cloud- oder Kontozwang</text>
  <rect x="706" y="20" width="830" height="48" class="legend-box" />
<line x1="722" y1="44" x2="768" y2="44" class="edge-teal" />
<text x="776" y="48" class="legend-txt">Lokaler In-App-Fluss (SQLite / 127.0.0.1)</text>
<line x1="1024" y1="44" x2="1070" y2="44" class="edge-ext" />
<text x="1078" y="48" class="legend-txt">Opt. externer Modellaufruf (oder lokal Ollama)</text>
<line x1="1346" y1="44" x2="1392" y2="44" class="edge-file" />
<text x="1400" y="48" class="legend-txt">Lokaler Dateitransfer</text>
<rect x="24" y="88" width="1512" height="275" class="lane" />
<text x="42" y="112" class="lane-title">MODUL A · DAUERHAFTER ARBEITSORDNER, ALTBESTANDS-SCHUTZ (WORKSPACE-R12) &amp; LOKALE PRÜFERPROFILE</text>
<rect x="24" y="384" width="1512" height="390" class="lane" />
<text x="42" y="408" class="lane-title">MODUL B · GEMEINSAMER 4-STUFEN-ZUSTANDSAUTOMAT FÜR EINZELPRÜFUNG, 1-RECHNER- &amp; 2-RECHNER-ZWEITPRÜFUNG</text>
<rect x="44" y="130" width="460" height="212" class="box-teal" />
<rect x="415" y="141" width="77" height="20" rx="5" fill="#0d9488" />
<text x="454" y="155" text-anchor="middle" class="badge">WORKSPACE</text>
<text x="58" y="156" class="box-head">Dauerhafter Standardpfad &amp; --workspace Vorrang</text>
<text x="58" y="175" class="box-code">library.default_workspace_path() · start-ux-maind.cmd</text>
<text x="58" y="195" class="box-text">• Standard unter Windows: %LOCALAPPDATA%\UX-mAInd\workspace</text>
<text x="58" y="213" class="box-text">• Geöffneter Pfad sichtbar in Sidebar, Korpus &amp; Einstellungen</text>
<text x="58" y="231" class="box-text">• Explizites --workspace &lt;Pfad&gt; hat immer Vorrang (trennt</text>
<text x="58" y="249" class="box-text">  Entwicklung &amp; Abnahmetests sauber vom BA-Arbeitsstand)</text>
<text x="58" y="267" class="box-text">• Alle Versionen, Belege &amp; Zwischenstände neustartfest in SQLite</text>
<rect x="550" y="130" width="460" height="212" class="box-amber" />
<rect x="921" y="141" width="77" height="20" rx="5" fill="#d97706" />
<text x="960" y="155" text-anchor="middle" class="badge">MIGRATION</text>
<text x="564" y="156" class="box-head">Schreibgeschützte workspace-r12-Erkennung &amp; Kopie</text>
<text x="564" y="175" class="box-code">library.probe_legacy_workspace() · ?mode=ro</text>
<text x="564" y="195" class="box-text">• Prüft beim Start lesend Nachbarordner workspace-r12</text>
<text x="564" y="213" class="box-text">• Zeigt Dokument-, Lauf- &amp; Finding-Zähler im Startbanner &amp; UI</text>
<text x="564" y="231" class="box-text">• Übernahme bei geschlossenem Studio per Ordner-Kopie nach</text>
<text x="564" y="249" class="box-text">  workspace (workspace-r12 bleibt als Rückfallebene erhalten!)</text>
<text x="564" y="267" class="box-text">• Stellt Standard-Ausgabeordner automatisch auf workspace\exports</text>
<rect x="1056" y="130" width="460" height="212" class="box-slate" />
<rect x="1434" y="141" width="70" height="20" rx="5" fill="#475569" />
<text x="1469" y="155" text-anchor="middle" class="badge">IDENTITY</text>
<text x="1070" y="156" class="box-head">Lokale Prüferprofile &amp; Architektur-Anschlusspunkt</text>
<text x="1070" y="175" class="box-code">auth.py · LocalProfileIdentityProvider · ReviewerIdentityProvider</text>
<text x="1070" y="195" class="box-text">• Einzelprüfung direkt mit lokalem Standard-Prüfer (freiwilliges 2. Profil)</text>
<text x="1070" y="213" class="box-text">• Für Zweitprüfung genügen Anzeigename oder Kürzel (z.B. CU / ZP2)</text>
<text x="1070" y="231" class="box-text">• 100 % lokal ohne Cloud-Dienst, Login-Mauer oder kommerzielles Konto</text>
<text x="1070" y="249" class="box-text">• Revisionssicherer Stempel in ux_decisions.payload.reviewer</text>
<text x="1070" y="267" class="box-text">• Protokoll ReviewerIdentityProvider für spätere SSO/OIDC-Anbindung</text>
<line x1="504" y1="236" x2="550" y2="236" class="edge" />
<text x="527" y="229" text-anchor="middle" class="edge-label">Prüft Altbestand</text>
<line x1="1010" y1="236" x2="1056" y2="236" class="edge-teal" />
<text x="1033" y="229" text-anchor="middle" class="edge-label">SQLite Settings</text>
<rect x="44" y="430" width="340" height="318" class="box-slate" />
<rect x="316" y="441" width="56" height="20" rx="5" fill="#475569" />
<text x="344" y="455" text-anchor="middle" class="badge">STEP 1</text>
<text x="58" y="456" class="box-head">Schritt 1 · Ausgangsstand festhalten</text>
<text x="58" y="475" class="box-code">create_session() · IN_PROGRESS</text>
<text x="58" y="495" class="box-text">• Auswahl beliebiger Findings der Studie</text>
<text x="58" y="513" class="box-text">• Wahl: ‚Am selben Rechner‘ ODER</text>
<text x="58" y="531" class="box-text">  ‚Auf zwei Rechnern‘</text>
<text x="58" y="549" class="box-text">• Friert kanonischen Snapshot ein:</text>
<text x="58" y="567" class="box-text">  – Originaldateien (source_sha256)</text>
<text x="58" y="585" class="box-text">  – DoclingDocument-Versionen</text>
<text x="58" y="603" class="box-text">  – Stufe-A-Läufe &amp; Originalbelege</text>
<text x="58" y="621" class="box-text">  – Ausgewählte Findings (F1..Fn)</text>
<text x="58" y="639" class="box-text">• Berechnet Prüfsumme baseline_sha256</text>
<rect x="424" y="430" width="345" height="318" class="box-violet" />
<rect x="645" y="441" width="112" height="20" rx="5" fill="#7c3aed" />
<text x="701" y="455" text-anchor="middle" class="badge">STEP 2 · BLIND</text>
<text x="438" y="456" class="box-head">Schritt 2 · Unabhängig bewerten</text>
<text x="438" y="475" class="box-code">save_judgment(phase=&#x27;initial&#x27;) · submit_slot()</text>
<text x="438" y="495" class="box-text">• Beide Prüfer sehen dieselben Vorschläge</text>
<text x="438" y="513" class="box-text">  &amp; Originalbelege in der Dual-View</text>
<text x="438" y="531" class="box-text">• Aktion: Bestätigen / Korrigieren /</text>
<text x="438" y="549" class="box-text">  Verwerfen / Offen + Begründung</text>
<text x="438" y="567" class="box-text">• STRIKTE VERBLINDUNG vor Freigabe:</text>
<text x="438" y="585" class="box-text">  Kein Zugriff auf fremdes Urteil, fremde</text>
<text x="438" y="603" class="box-text">  Finding-Korrekturen, Historie, Graph</text>
<text x="438" y="621" class="box-text">  oder gespeicherte Exporte (HTTP 403)!</text>
<text x="438" y="639" class="box-text">• Abgabe friert Ersturteil fest ein</text>
<rect x="809" y="430" width="345" height="318" class="box-amber" />
<rect x="1016" y="441" width="126" height="20" rx="5" fill="#d97706" />
<text x="1079" y="455" text-anchor="middle" class="badge">STEP 3 · COMPARE</text>
<text x="823" y="456" class="box-head">Schritt 3 · Vergleichen &amp; Revidieren</text>
<text x="823" y="475" class="box-code">release_comparison() · save_judgment(&#x27;revision&#x27;)</text>
<text x="823" y="495" class="box-text">• Freigabe-Sperre: Erst aktiv, sobald</text>
<text x="823" y="513" class="box-text">  submitted_a_at UND submitted_b_at gesetzt</text>
<text x="823" y="531" class="box-text">• Zeigt Ersturteile, Begründungen &amp;</text>
<text x="823" y="549" class="box-text">  abweichende Felder nebeneinander</text>
<text x="823" y="567" class="box-text">• Jede Person kann danach optional eine</text>
<text x="823" y="585" class="box-text">  Folgebewertung abgeben (phase=&#x27;revision&#x27;)</text>
<text x="823" y="603" class="box-text">• Abgegebenes Ersturteil (initial) bleibt</text>
<text x="823" y="621" class="box-text">  im Verlauf &amp; JSON unverändert erhalten!</text>
<rect x="1194" y="430" width="322" height="318" class="box-emerald" />
<rect x="1392" y="441" width="112" height="20" rx="5" fill="#059669" />
<text x="1448" y="455" text-anchor="middle" class="badge">STEP 4 · ADOPT</text>
<text x="1208" y="456" class="box-head">Schritt 4 · Ergebnis übernehmen</text>
<text x="1208" y="475" class="box-code">adopt_resolution() · Exporte</text>
<text x="1208" y="495" class="box-text">• Ausdrückliche Wahl für den Studienstand:</text>
<text x="1208" y="513" class="box-text">  – Fassung Prüfer 1 / Prüfer 2</text>
<text x="1208" y="531" class="box-text">  – Ausgangsvorschlag / Konsensfassung</text>
<text x="1208" y="549" class="box-text">  – Oder ‚Offene Abweichung‘ belassen</text>
<text x="1208" y="567" class="box-text">• A4-HTML &amp; Markdown zeigen gewählten</text>
<text x="1208" y="585" class="box-text">  Stand + offene Abweichungen</text>
<text x="1208" y="603" class="box-text">• Forschungs-JSON enthält Ersturteile,</text>
<text x="1208" y="621" class="box-text">  Revisionen &amp; übernommene Fassung</text>
<line x1="384" y1="589" x2="424" y2="589" class="edge-teal" />
<text x="404" y="582" text-anchor="middle" class="edge-label">Freeze</text>
<line x1="769" y1="589" x2="809" y2="589" class="edge-amber" />
<text x="789" y="582" text-anchor="middle" class="edge-label">Beide abgegeben</text>
<line x1="1154" y1="589" x2="1194" y2="589" class="edge-teal" />
<text x="1174" y="582" text-anchor="middle" class="edge-label">Auswahl</text>
</svg>
