<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 780" width="1560" height="780">

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #475569; }
      .lane-title { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.04em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; ry: 10; }
      .box-teal { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-sky { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-emerald { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; rx: 10; ry: 10; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 14; ry: 14; }
      .box-head { font: 700 13.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .box-code { font: 600 11.5px Consolas, 'JetBrains Mono', monospace; fill: #0f766e; }
      .box-text { font: 400 12px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
      .badge { font: 700 10.5px Consolas, monospace; fill: #ffffff; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-teal { stroke: #0d9488; stroke-width: 2.0; fill: none; marker-end: url(#arrow-teal); }
      .edge-amber { stroke: #d97706; stroke-width: 1.9; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-amber); }
      .edge-label { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="780" class="bg" />
  <text x="32" y="42" class="title">Detaildiagramm 04 — Stufen B &amp; C: Triangulation, Epistemische Prüfung &amp; Wissensgraph</text>
  <text x="32" y="65" class="subtitle">Wie Einzelbeobachtungen über Dokumentgrenzen hinweg vernetzt, epistemisch gewichtet und im Graphen kuratiert werden</text>
  <rect x="24" y="88" width="1512" height="315" class="lane" />
<text x="42" y="112" class="lane-title">STUFEN B &amp; C · DOKUMENTÜBERGREIFENDE SYNTHESE MIT STRIKTER DATEN-INSTRUKTIONS-TRENNUNG</text>
<rect x="24" y="425" width="1512" height="330" class="lane" />
<text x="42" y="449" class="lane-title">EPISTEMISCHE PRÜFUNG &amp; INTERAKTIVER REACT-FLOW EVIDENZGRAPH</text>
<rect x="44" y="130" width="360" height="250" class="box-teal" />
<rect x="315" y="141" width="77" height="20" rx="5" fill="#0d9488" />
<text x="354" y="155" text-anchor="middle" class="badge">PURE DATA</text>
<text x="58" y="156" class="box-head">Reines Synthese-Dokument</text>
<text x="58" y="175" class="box-code">evidence.json + system_appendix</text>
<text x="58" y="195" class="box-text">• evidence.json enthält 100 % strukturierte Daten:</text>
<text x="58" y="213" class="box-text">  Observations, Anchors, Messwerte, Kontextblöcke</text>
<text x="58" y="231" class="box-text">• KEINE Prompt-Anweisungen im Daten-JSON!</text>
<text x="58" y="249" class="box-text">• Ausgabesprache &amp; Zusatzprompt laufen sauber</text>
<text x="58" y="267" class="box-text">  über system_appendix im System-Prompt</text>
<rect x="454" y="130" width="340" height="250" class="box-amber" />
<rect x="719" y="141" width="63" height="20" rx="5" fill="#d97706" />
<text x="751" y="155" text-anchor="middle" class="badge">STUFE B</text>
<text x="468" y="156" class="box-head">Stufe B · Relationen-Vorschläge</text>
<text x="468" y="175" class="box-code">UXRelationProposals (Stage B)</text>
<text x="468" y="195" class="box-text">• Verbindet source -&gt; target Beobachtungs-IDs</text>
<text x="468" y="213" class="box-text">• Typen: corroborates, contradicts,</text>
<text x="468" y="231" class="box-text">  elaborates, causes, sequence</text>
<text x="468" y="249" class="box-text">• structured_sparse_check=False verhindert</text>
<text x="468" y="267" class="box-text">  unnötigen Fallback bei prägnanten Antworten</text>
<rect x="844" y="130" width="360" height="250" class="box-emerald" />
<rect x="1129" y="141" width="63" height="20" rx="5" fill="#059669" />
<text x="1161" y="155" text-anchor="middle" class="badge">STUFE C</text>
<text x="858" y="156" class="box-head">Stufe C · Finding-Kandidaten</text>
<text x="858" y="175" class="box-code">UXFindingProposals (Stage C)</text>
<text x="858" y="195" class="box-text">• Synthetisiert UX-Befunde mit Pflicht-Ankern:</text>
<text x="858" y="213" class="box-text">  supports[], opposes[], qualifies[], relations[]</text>
<text x="858" y="231" class="box-text">• Klassifiziert Valenz, Scope, Observed Effect</text>
<text x="858" y="249" class="box-text">• Optional: Nielsen H1–H10 / ISO 9241-110</text>
<text x="858" y="267" class="box-text">• Gestaltungshypothese klar als ungeprüft markiert</text>
<rect x="1254" y="130" width="260" height="250" class="box-rose" />
<rect x="1448" y="141" width="54" height="20" rx="5" fill="#e11d48" />
<text x="1475" y="155" text-anchor="middle" class="badge">AUDIT</text>
<text x="1268" y="156" class="box-head">Referenz-Validierung</text>
<text x="1268" y="175" class="box-code">interpretation._valid_ref()</text>
<text x="1268" y="195" class="box-text">• Prüft jede vom LLM genannte</text>
<text x="1268" y="213" class="box-text">  (document, run, observation)-ID</text>
<text x="1268" y="231" class="box-text">• Unbekannte IDs werden als</text>
<text x="1268" y="249" class="box-text">  unresolved protokolliert statt</text>
<text x="1268" y="267" class="box-text">  stillschweigend geschluckt</text>
<line x1="404" y1="255" x2="454" y2="255" class="edge" />
<text x="429" y="248" text-anchor="middle" class="edge-label">Stufe B</text>
<line x1="794" y1="255" x2="844" y2="255" class="edge" />
<text x="819" y="248" text-anchor="middle" class="edge-label">A + B</text>
<line x1="1204" y1="255" x2="1254" y2="255" class="edge" />
<text x="1229" y="248" text-anchor="middle" class="edge-label">ID-Prüfung</text>
<rect x="44" y="468" width="380" height="262" class="box-amber" />
<rect x="328" y="479" width="84" height="20" rx="5" fill="#d97706" />
<text x="370" y="493" text-anchor="middle" class="badge">EPISTEMICS</text>
<text x="58" y="494" class="box-head">Epistemische Unabhängigkeitsprüfung</text>
<text x="58" y="513" class="box-code">research._finding_epistemics()</text>
<text x="58" y="533" class="box-text">• Prüft supports, opposes, qualifies &amp; improvement</text>
<text x="58" y="551" class="box-text">• Erkennt verworfene Beobachtungen sofort:</text>
<text x="58" y="569" class="box-text">  Flag contains_rejected_support + Abzug im Zähler</text>
<text x="58" y="587" class="box-text">• Verhindert Doppelzählung von Text + Ganzfolien-</text>
<text x="58" y="605" class="box-text">  Render derselben Seite (dependent_visual_overlap)</text>
<text x="58" y="623" class="box-text">• Zählt unabhängige Dokumente &amp; Sprecherrollen</text>
<rect x="474" y="468" width="370" height="262" class="box-sky" />
<rect x="762" y="479" width="70" height="20" rx="5" fill="#0284c7" />
<text x="797" y="493" text-anchor="middle" class="badge">GRAPH UI</text>
<text x="488" y="494" class="box-head">Wissensgraph-Topologie &amp; Modi</text>
<text x="488" y="513" class="box-code">nx.DiGraph + GraphView.jsx + graphLayout.js</text>
<text x="488" y="533" class="box-text">• Findings-Ketten: C -&gt; B -&gt; A -&gt; Bildquelle</text>
<text x="488" y="551" class="box-text">• Gesamtnetz: projiziert Dokumentquellen-Karten</text>
<text x="488" y="569" class="box-text">  für Text/Tabellen (.txt, .docx, .odt) + Bildquellen</text>
<text x="488" y="587" class="box-text">• Gegenbelege: isoliert rot gestrichelte Widersprüche</text>
<text x="488" y="605" class="box-text">• 16:9 Shelf-Layout + farbige MiniMap ab 1 Knoten</text>
<rect x="894" y="468" width="330" height="262" class="box-emerald" />
<rect x="1121" y="479" width="91" height="20" rx="5" fill="#059669" />
<text x="1167" y="493" text-anchor="middle" class="badge">INTERACTIVE</text>
<text x="908" y="494" class="box-head">Interaktive Korrektur im Graphen</text>
<text x="908" y="513" class="box-code">Drag &amp; Drop · ‚Verbindung lösen‘</text>
<text x="908" y="533" class="box-text">• Jede Karte frei verschiebbar + Auto-Layout-Reset</text>
<text x="908" y="551" class="box-text">• Relationen direkt im Inspektor verwerfen</text>
<text x="908" y="569" class="box-text">• Fehlerhafte Stütz-/Gegen-/B-Kanten einzeln</text>
<text x="908" y="587" class="box-text">  vom Finding lösen (ux-decision: corrected)</text>
<text x="908" y="605" class="box-text">• Verworfene Knoten verschwinden aus aktivem Netz</text>
<rect x="1274" y="468" width="240" height="262" class="box-teal" />
<rect x="1425" y="479" width="77" height="20" rx="5" fill="#0d9488" />
<text x="1464" y="493" text-anchor="middle" class="badge">DEEP LINK</text>
<text x="1288" y="494" class="box-head">Nahtloser Belegsprung</text>
<text x="1288" y="513" class="box-code">onShowSource(findingContext)</text>
<text x="1288" y="533" class="box-text">• 1 Klick auf beliebigen Beleg</text>
<text x="1288" y="551" class="box-text">  öffnet Dual-View-Inspektor</text>
<text x="1288" y="569" class="box-text">• Übergibt komplette Belegkette</text>
<text x="1288" y="587" class="box-text">  des Findings als klickbare</text>
<text x="1288" y="605" class="box-text">  Fokusleiste oben im Viewer</text>
<path d="M 1384 380 L 1384 410 L 234 410 L 234 468" class="edge-teal" />
<text x="810" y="406" text-anchor="middle" class="edge-label">Geprüfte Objekte</text>
<line x1="424" y1="598" x2="474" y2="598" class="edge" />
<text x="449" y="591" text-anchor="middle" class="edge-label">Flags &amp; Metriken</text>
<line x1="844" y1="598" x2="894" y2="598" class="edge" />
<text x="869" y="591" text-anchor="middle" class="edge-label">Auswahl</text>
<line x1="1224" y1="598" x2="1274" y2="598" class="edge-teal" />
<text x="1249" y="591" text-anchor="middle" class="edge-label">Original prüfen</text>
</svg>
