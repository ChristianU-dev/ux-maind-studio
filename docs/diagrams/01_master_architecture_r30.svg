<text x="1312" y="397" text-anchor="middle" class="badge">VERIFY</text>
<text x="956" y="398" class="box-head">Deterministisches Re-Grounding</text>
<text x="956" y="417" class="box-code">evidence.Sources.locate() · observation_view()</text>
<text x="956" y="437" class="box-text">• 1. Exakter Span · 2. Ligaturen (ﬁ/ﬂ) &amp; Trennstriche</text>
<text x="956" y="455" class="box-text">• 3. Wortgrenzen (&#x27;5%&#x27; matcht niemals in &#x27;15%&#x27;)</text>
<text x="956" y="473" class="box-text">• 4. Verbundene Tabellenzellen &amp; Zitatlisten („...“)</text>
<text x="956" y="491" class="box-text">• Kandidaten-Anker + ambiguous_count bei Mehrdeutigkeit</text>
<rect x="1402" y="372" width="352" height="196" class="box-amber" />
<rect x="1688" y="383" width="54" height="20" rx="5" fill="#d97706" />
