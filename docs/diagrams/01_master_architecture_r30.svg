<text x="56" y="171" class="box-code">workspace.import_paths() · SHA-256</text>
<text x="56" y="191" class="box-text">• PDF, DOCX, PPTX, ODT, XLSX, CSV</text>
<text x="56" y="209" class="box-text">• WebVTT, Markdown, HTML, TXT, PNG/JPG</text>
<text x="56" y="227" class="box-text">• Frei gewählter Ordner ohne Pflicht-Whitelist</text>
<text x="56" y="245" class="box-text">• Unveränderte Kopie in work/stored/</text>
