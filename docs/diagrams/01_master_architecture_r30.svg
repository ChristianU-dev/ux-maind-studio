<text x="496" y="417" class="box-code">native_graph.py · UXEvidenceDocument</text>
<text x="496" y="437" class="box-text">• Feldtexte &lt;= 240 Zeichen (0 Schema-Trunkierung)</text>
<text x="496" y="455" class="box-text">• httpx.Timeout + Stream-Idle-Watchdog + Live-Konsole</text>
<text x="496" y="473" class="box-text">• Extrahiert Zitate, Messwerte, Skalenpolung, Kontext</text>
<text x="496" y="491" class="box-text">• Erkennt SCHEMA_SALVAGED &amp; reasoning_tokens</text>
