<text x="466" y="209" class="box-text">• PPTX/DOCX Durchstreichungen &amp; Vortragsnotizen</text>
<text x="466" y="227" class="box-text">• LibreOffice Ganzfolien-Render (slide_context)</text>
<text x="466" y="245" class="box-text">• Basis-DoclingDocument JSON (work/native/)</text>
