<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" width="1560" height="760">

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 22px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #475569; }
      .lane-title { font: 700 13px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; letter-spacing: 0.04em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; ry: 10; }
      .box-teal { fill: #f0fdfa; stroke: #0d9488; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-sky { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-emerald { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.8; rx: 10; ry: 10; }
      .box-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; rx: 10; ry: 10; }
      .lane { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 14; ry: 14; }
      .box-head { font: 700 13.5px 'Segoe UI', Inter, system-ui, sans-serif; fill: #0f172a; }
      .box-code { font: 600 11.5px Consolas, 'JetBrains Mono', monospace; fill: #0f766e; }
      .box-text { font: 400 12px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
      .badge { font: 700 10.5px Consolas, monospace; fill: #ffffff; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-teal { stroke: #0d9488; stroke-width: 2.0; fill: none; marker-end: url(#arrow-teal); }
      .edge-amber { stroke: #d97706; stroke-width: 1.9; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-amber); }
      .edge-label { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="760" class="bg" />
  <text x="32" y="42" class="title">Detaildiagramm 02 — Lokale Docling-Konvertierung, Office-Brücke &amp; Visuelle Anreicherung</text>
  <text x="32" y="65" class="subtitle"> Zusammenspiel von nativen Docling-Pipelines, gezielten UX-mAInd-Formatierungsbrücken und versionierter Vision-Analyse</text>
  <rect x="24" y="88" width="1512" height="310" class="lane" />
<text x="42" y="112" class="lane-title">STUFE 01 · LOKALE DOCLING-KONVERTIERUNG &amp; OFFICE-FORMATIERUNGSBRÜCKE (KEIN CLOUD-AUFRUF)</text>
<rect x="24" y="420" width="1512" height="310" class="lane" />
<text x="42" y="444" class="lane-title">STUFE 02 · OPTIONALE VISUELLE ANALYSE (BEWUSSTE PIXEL-FREIGABE &amp; VERSIONIERTES DOCLINGDOCUMENT)</text>
<rect x="44" y="130" width="330" height="245" class="box-slate" />
<rect x="299" y="141" width="63" height="20" rx="5" fill="#475569" />
<text x="331" y="155" text-anchor="middle" class="badge">FORMATE</text>
<text x="58" y="156" class="box-head">Eingangsformate im Korpus</text>
<text x="58" y="175" class="box-code">InputFormat (Docling v2.88+)</text>
<text x="58" y="195" class="box-text">• PDF &amp; Scans (PNG, JPG, TIFF, WEBP)</text>
<text x="58" y="213" class="box-text">• Word (.docx) &amp; OpenDocument (.odt)</text>
<text x="58" y="231" class="box-text">• PowerPoint (.pptx) inkl. Speaker Notes</text>
<text x="58" y="249" class="box-text">• Tabellen (.xlsx, .csv)</text>
<text x="58" y="267" class="box-text">• Transkripte (.vtt, .txt, .md, .html)</text>
<text x="58" y="285" class="box-text">• SHA-256 Deduplizierung beim Import</text>
<rect x="424" y="130" width="360" height="245" class="box-teal" />
<rect x="709" y="141" width="63" height="20" rx="5" fill="#0d9488" />
<text x="741" y="155" text-anchor="middle" class="badge">DOCLING</text>
<text x="438" y="156" class="box-head">Docling Standard-Pipeline</text>
<text x="438" y="175" class="box-code">DocumentConverter · PdfPipelineOptions</text>
<text x="438" y="195" class="box-text">• OCR: RapidOCR / EasyOCR / Tesseract / Mac</text>
<text x="438" y="213" class="box-text">• TableFormer: ACCURATE oder FAST + Zellmatching</text>
<text x="438" y="231" class="box-text">• Layout-BBoxen, Lesereihenfolge &amp; Seitenbilder</text>
<text x="438" y="249" class="box-text">• Code-/Formel-Erkennung &amp; Seitenbereich-Limit</text>
<text x="438" y="267" class="box-text">• Qualitätsmetriken: layout / parse / table / ocr</text>
<rect x="834" y="130" width="340" height="245" class="box-amber" />
<rect x="1106" y="141" width="56" height="20" rx="5" fill="#d97706" />
<text x="1134" y="155" text-anchor="middle" class="badge">BRIDGE</text>
<text x="848" y="156" class="box-head">UX-mAInd Office-Erweiterung</text>
<text x="848" y="175" class="box-code">office.py (Nachgewiesene Bibliothekslücke)</text>
<text x="848" y="195" class="box-text">• pptx_formatting(): Run- &amp; Teil-Streichungen</text>
<text x="848" y="213" class="box-text">• docx_formatting(): Absatz- &amp; Zellen-Streichungen</text>
<text x="848" y="231" class="box-text">• office_pdf(): LibreOffice Headless Anzeige-PDF</text>
<text x="848" y="249" class="box-text">• attach_slide_views(): Ganzfolien als PictureItem</text>
<text x="848" y="267" class="box-text">• attach_pdf_page_views(): Seitenkontext für PDFs</text>
<rect x="1224" y="130" width="290" height="245" class="box-emerald" />
<rect x="1425" y="141" width="77" height="20" rx="5" fill="#059669" />
<text x="1464" y="155" text-anchor="middle" class="badge">NATIVE V0</text>
<text x="1238" y="156" class="box-head">Basis-DoclingDocument</text>
<text x="1238" y="175" class="box-code">work/native/&lt;id&gt;.json</text>
<text x="1238" y="195" class="box-text">• Einheitlicher JSON-Baum (v1.10)</text>
<text x="1238" y="213" class="box-text">• texts, tables, pictures, groups</text>
<text x="1238" y="231" class="box-text">• key_value_items &amp; form_items</text>
<text x="1238" y="249" class="box-text">• ContentLayer: BODY, NOTES, FURNITURE</text>
<text x="1238" y="267" class="box-text">• Unveränderbare Basis-Version</text>
<line x1="374" y1="252" x2="424" y2="252" class="edge" />
<text x="399" y="245" text-anchor="middle" class="edge-label">Lokal</text>
<line x1="784" y1="252" x2="834" y2="252" class="edge" />
<text x="809" y="245" text-anchor="middle" class="edge-label">PPTX/DOCX/PDF</text>
<line x1="1174" y1="252" x2="1224" y2="252" class="edge-teal" />
<text x="1199" y="245" text-anchor="middle" class="edge-label">JSON + SHA256</text>
<rect x="44" y="464" width="350" height="240" class="box-rose" />
<rect x="319" y="475" width="63" height="20" rx="5" fill="#e11d48" />
<text x="351" y="489" text-anchor="middle" class="badge">CONSENT</text>
<text x="58" y="490" class="box-head">Explizite Datenschutz-Freigabe</text>
<text x="58" y="509" class="box-code">send_pixels=True · Vision-Probe</text>
<text x="58" y="529" class="box-text">• Ohne Freigabe verlassen 0 Pixel den PC</text>
<text x="58" y="547" class="box-text">• Einstellbare Mindestbildfläche (z.B. 5%)</text>
<text x="58" y="565" class="box-text">• Live-Test ‚Vision testen‘ (1×1 PNG Probe)</text>
<text x="58" y="583" class="box-text">• Unterstützt Lokal (Ollama), FAU (Qwen3.6)</text>
<text x="58" y="601" class="box-text">  oder Cloud-VLMs über OpenAI-kompatible API</text>
<rect x="444" y="464" width="370" height="240" class="box-sky" />
<rect x="746" y="475" width="56" height="20" rx="5" fill="#0284c7" />
<text x="774" y="489" text-anchor="middle" class="badge">PROMPT</text>
<text x="458" y="490" class="box-head">Editierbarer Vision-Prompt &amp; Modi</text>
<text x="458" y="509" class="box-code">prompts_config.py · enrichment.py</text>
<text x="458" y="529" class="box-text">• Standard-Basisprompt vollständig editierbar</text>
<text x="458" y="547" class="box-text">• + Optionale projektspezifische Zusatzregeln</text>
<text x="458" y="565" class="box-text">• 1-Klick Reset auf Werkseinstellung</text>
<text x="458" y="583" class="box-text">• Automatische Aktivierung von FigureClassifier,</text>
<text x="458" y="601" class="box-text">  sobald Chart-Extraktion eingeschaltet wird</text>
<rect x="864" y="464" width="330" height="240" class="box-sky" />
<rect x="1126" y="475" width="56" height="20" rx="5" fill="#0284c7" />
<text x="1154" y="489" text-anchor="middle" class="badge">ENRICH</text>
<text x="878" y="490" class="box-head">Docling Vision-Anreicherung</text>
<text x="878" y="509" class="box-code">PictureDescriptionApiOptions · GraniteChart</text>
<text x="878" y="529" class="box-text">• Schreibt PictureMeta.description.text</text>
<text x="878" y="547" class="box-text">• Extrahiert Balken-/Liniendiagramme in</text>
<text x="878" y="565" class="box-text">  PictureMeta.tabular_chart.chart_data</text>
<text x="878" y="583" class="box-text">• Speichert Modell, Parameter &amp; Dauer im</text>
<text x="878" y="601" class="box-text">  Versions-Beleg (versions-Tabelle)</text>
<rect x="1244" y="464" width="270" height="240" class="box-emerald" />
<rect x="1418" y="475" width="84" height="20" rx="5" fill="#059669" />
<text x="1460" y="489" text-anchor="middle" class="badge">NATIVE V1+</text>
<text x="1258" y="490" class="box-head">Angereicherte Version</text>
<text x="1258" y="509" class="box-code">work/versions/&lt;sha256&gt;.json</text>
<text x="1258" y="529" class="box-text">• Basis-JSON bleibt erhalten!</text>
<text x="1258" y="547" class="box-text">• Jede Bildaussage trägt Herkunft:</text>
<text x="1258" y="565" class="box-text">  picture_description oder</text>
<text x="1258" y="583" class="box-text">  chart_enrichment / slide_context</text>
<text x="1258" y="601" class="box-text">• Sofort bereit für Stufe A</text>
<path d="M 1369 375 L 1369 405 L 219 405 L 219 464" class="edge-teal" />
<text x="790" y="401" text-anchor="middle" class="edge-label">Bilder &amp; Folien</text>
<line x1="394" y1="584" x2="444" y2="584" class="edge" />
<text x="419" y="577" text-anchor="middle" class="edge-label">Freigabe</text>
<line x1="814" y1="584" x2="864" y2="584" class="edge" />
<text x="839" y="577" text-anchor="middle" class="edge-label">API / Lokal</text>
<line x1="1194" y1="584" x2="1244" y2="584" class="edge-teal" />
<text x="1219" y="577" text-anchor="middle" class="edge-label">Meta-Felder</text>
</svg>
