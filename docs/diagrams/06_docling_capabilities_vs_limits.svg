      .edge-teal { stroke: #0d9488; stroke-width: 2.0; fill: none; marker-end: url(#arrow-teal); }
      .edge-amber { stroke: #d97706; stroke-width: 1.9; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-amber); }
      .edge-ext { stroke: #0284c7; stroke-width: 2.1; stroke-dasharray: 8 4; fill: none; marker-end: url(#arrow-sky); }
      .edge-file { stroke: #7c3aed; stroke-width: 2.4; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrow-violet); }
      .edge-label { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #334155; }
      .legend-box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; ry: 8; }
      .legend-txt { font: 600 11px 'Segoe UI', Inter, system-ui, sans-serif; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="840" class="bg" />
  <text x="32" y="42" class="title">Detaildiagramm 06 — Docling-Fähigkeiten, UX-mAInd-Erweiterungen &amp; Ehrliche Systemgrenzen</text>
  <text x="32" y="65" class="subtitle">Wissenschaftliche Einordnung für die Bachelorarbeit: Was Docling nativ leistet, welche Lücken UX-mAInd schließt und wo Grenzen bleiben</text>
  <rect x="28" y="90" width="500" height="722" class="lane" />
<text x="46" y="116" class="lane-title">1. GENUTZTE NATIVE DOCLING-STÄRKEN</text>
<rect x="46" y="134" width="464" height="155" class="box-teal" />
<rect x="444" y="145" width="54" height="20" rx="5" fill="#0d9488" />
<text x="471" y="159" text-anchor="middle" class="badge">NATIV</text>
<text x="60" y="160" class="box-head">Einheitliches DoclingDocument (v1.10)</text>
<text x="60" y="179" class="box-code">docling + docling-core</text>
<text x="60" y="199" class="box-text">• Gemeinsames typsicheres Datenmodell über 11+ Dateiformate</text>
<text x="60" y="217" class="box-text">• Bewahrt Seiten-Provenienz (page_no, BoundingBox, charspan)</text>
<text x="60" y="235" class="box-text">• Trennt sauber BODY, NOTES (Vortragsnotizen) &amp; FURNITURE</text>
<text x="60" y="253" class="box-text">• Native Web-Komponenten (&lt;docling-img&gt;) für Geometrie-Overlay</text>
<rect x="46" y="306" width="464" height="155" class="box-teal" />
<rect x="444" y="317" width="54" height="20" rx="5" fill="#0d9488" />
<text x="471" y="331" text-anchor="middle" class="badge">LOKAL</text>
<text x="60" y="332" class="box-head">Lokale KI-Modelle für Layout, Tabellen &amp; OCR</text>
<text x="60" y="351" class="box-code">PdfPipelineOptions · TableFormer · RapidOCR</text>
<text x="60" y="371" class="box-text">• Komplett lokale Ausführung ohne API-Kosten &amp; ohne Datenabfluss</text>
<text x="60" y="389" class="box-text">• TableFormer rekonstruiert komplexe Zeilen-/Spalten-Spans</text>
<text x="60" y="407" class="box-text">• Automatische Konfidenzwerte (layout, parse, table, ocr)</text>
<text x="60" y="425" class="box-text">• DocLang- &amp; Markdown-Serialisierung für strukturtreue Prompts</text>
<rect x="46" y="478" width="464" height="155" class="box-teal" />
<rect x="442" y="489" width="56" height="20" rx="5" fill="#0d9488" />
<text x="470" y="503" text-anchor="middle" class="badge">SCHEMA</text>
<text x="60" y="504" class="box-head">Schema-geführte Extraktion &amp; Vision-API</text>
<text x="60" y="523" class="box-code">docling-graph · PictureDescriptionApiOptions</text>
<text x="60" y="543" class="box-text">• Pydantic-basierte Extraktionsverträge mit Gleaning-Option</text>
<text x="60" y="561" class="box-text">• HybridChunker für überlange Einzeltranskripte</text>
<text x="60" y="579" class="box-text">• Native Einbindung OpenAI-kompatibler Vision-Endpunkte</text>
<text x="60" y="597" class="box-text">• Optionale lokale Diagramm-Extraktion (Granite-Chart)</text>
<rect x="46" y="650" width="464" height="144" class="box-emerald" />
<rect x="421" y="661" width="77" height="20" rx="5" fill="#059669" />
<text x="460" y="675" text-anchor="middle" class="badge">OSI-CLEAN</text>
<text x="60" y="676" class="box-head">100 % Open-Source Lizenzkonformität</text>
<text x="60" y="695" class="box-code">MIT / Apache-2.0 / BSD · 0 Proprietäre Pakete</text>
<text x="60" y="715" class="box-text">• Verifiziert über scripts/verify_open_source_licenses.py</text>
<text x="60" y="733" class="box-text">• Gebündelte Drittanbieter-Lizenzen in generated/LICENSES.txt</text>
<rect x="550" y="90" width="500" height="722" class="lane" />
<text x="568" y="116" class="lane-title">2. DURCH UX-MAIND GESCHLOSSENE LÜCKEN</text>
<rect x="568" y="134" width="464" height="155" class="box-sky" />
<rect x="964" y="145" width="56" height="20" rx="5" fill="#0284c7" />
<text x="992" y="159" text-anchor="middle" class="badge">GELÖST</text>
<text x="582" y="160" class="box-head">Office-Streichungen, Folienkontext &amp; Tabellen-IDs</text>
<text x="582" y="179" class="box-code">office.py · evidence.model_source()</text>
<text x="582" y="199" class="box-text">• Docling verwirft in PPTX/DOCX teilweise Run-Durchstreichungen -&gt;</text>
<text x="582" y="217" class="box-text">  UX-mAInd extrahiert sie gezielt aus dem Office-XML</text>
<text x="582" y="235" class="box-text">• Rendert PPTX-Ganzfolien via LibreOffice für räumlichen Kontext</text>
<text x="582" y="253" class="box-text">• Injiziert #/tables/i + Header in DocLang gegen blinde Zellenanker</text>
<rect x="568" y="306" width="464" height="155" class="box-sky" />
<rect x="964" y="317" width="56" height="20" rx="5" fill="#0284c7" />
<text x="992" y="331" text-anchor="middle" class="badge">GELÖST</text>
<text x="582" y="332" class="box-head">Deterministisches Zitat- &amp; Zahlen-Re-Grounding</text>
<text x="582" y="351" class="box-code">evidence.Sources.locate() (R30)</text>
<text x="582" y="371" class="box-text">• Docling-Graph prüft JSON-Typen, aber NICHT, ob ein Zitat</text>
<text x="582" y="389" class="box-text">  wirklich wörtlich im Dokument steht -&gt; UX-mAInd verifiziert</text>
<text x="582" y="407" class="box-text">  jedes Zitat &amp; jede Zahl inkl. Ligaturen, Trennstrichen &amp;</text>
<text x="582" y="425" class="box-text">  Wortgrenzen (&#x27;5%&#x27; != &#x27;15%&#x27;) und bietet 1-Klick-Kandidaten</text>
<rect x="568" y="478" width="464" height="155" class="box-sky" />
<rect x="964" y="489" width="56" height="20" rx="5" fill="#0284c7" />
<text x="992" y="503" text-anchor="middle" class="badge">GELÖST</text>
<text x="582" y="504" class="box-head">Dokumentübergreifende Synthese &amp; Epistemik</text>
<text x="582" y="523" class="box-code">interpretation.py · research.py</text>
<text x="582" y="543" class="box-text">• Docling arbeitet einzeldateibezogen -&gt; UX-mAInd ergänzt</text>
<text x="582" y="561" class="box-text">  Stufe B (Relationen) &amp; Stufe C (Findings + Gegenbelege)</text>
<text x="582" y="579" class="box-text">• Verhindert Doppelzählung überlappender Folien- &amp; Textbelege</text>
<text x="582" y="597" class="box-text">• Trennt KI-Vorschlag und Forscher-Entscheidung revisionssicher</text>
<rect x="568" y="650" width="464" height="144" class="box-sky" />
<rect x="964" y="661" width="56" height="20" rx="5" fill="#0284c7" />
<text x="992" y="675" text-anchor="middle" class="badge">GELÖST</text>
<text x="582" y="676" class="box-head">Ehrliche Telemetrie, Prompt-Kontrolle &amp; A4-Handout</text>
<text x="582" y="695" class="box-code">telemetry.py · prompts_config.py</text>
<text x="582" y="715" class="box-text">• Editierbare Basis- &amp; Zusatzprompts + Reset pro Stufe</text>
<text x="582" y="733" class="box-text">• Echte LiteLLM-Tarife (0,00 € FAU/Lokal, 0 fiktive Preise)</text>
<text x="582" y="751" class="box-text">• Druckfertiges A4-Handout + SQLite-Rekonstruktion im Terminal</text>
<rect x="1072" y="90" width="500" height="722" class="lane" />
<text x="1090" y="116" class="lane-title">3. VERBLEIBENDE SYSTEMGRENZEN (BA-DISKUSSION)</text>
<rect x="1090" y="134" width="464" height="155" class="box-amber" />
<rect x="1486" y="145" width="56" height="20" rx="5" fill="#d97706" />
<text x="1514" y="159" text-anchor="middle" class="badge">GRENZE</text>
<text x="1104" y="160" class="box-head">LibreOffice-Anzeige &amp; Floating-Shapes in Office</text>
<text x="1104" y="179" class="box-code">SYSTEM_LIMITS.md · Grenze L1 &amp; L2</text>
<text x="1104" y="199" class="box-text">• LibreOffice-PDF kann bei proprietären Windows-Schriften im</text>
<text x="1104" y="217" class="box-text">  Seitenumbruch leicht vom nativen MS-Office-Layout abweichen</text>
<text x="1104" y="235" class="box-text">  (daher explizites Badge ‚Anzeige-Derivat, keine Originalquelle‘)</text>
<text x="1104" y="253" class="box-text">• Frei schwebende SmartArt-/Textfeld-XML-Knoten in DOCX teils</text>
<text x="1104" y="271" class="box-text">  außerhalb der Standard-Absatzliste von python-docx</text>
<rect x="1090" y="306" width="464" height="155" class="box-amber" />
<rect x="1486" y="317" width="56" height="20" rx="5" fill="#d97706" />
<text x="1514" y="331" text-anchor="middle" class="badge">GRENZE</text>
<text x="1104" y="332" class="box-head">VLM-Deutungsfehler &amp; Audio/Video-Rohdaten</text>
<text x="1104" y="351" class="box-code">SYSTEM_LIMITS.md · Grenze L3 &amp; L4</text>
<text x="1104" y="371" class="box-text">• Vision-Sprachmodelle können kleine UI-Icons oder komplexe</text>
<text x="1104" y="389" class="box-text">  Diagrammachsen fehlinterpretieren -&gt; als abgeleitete Quelle</text>
<text x="1104" y="407" class="box-text">  markiert, im Dual-View immer gegen Originalbild prüfbar</text>
<text x="1104" y="425" class="box-text">• Verarbeitet fertige Transkripte (.vtt/.txt); direkte Audio-/</text>
<text x="1104" y="443" class="box-text">  Video-ASR &amp; Sprecherdiarisierung sind bewusst vorgelagert</text>
<rect x="1090" y="478" width="464" height="155" class="box-amber" />
<rect x="1486" y="489" width="56" height="20" rx="5" fill="#d97706" />
<text x="1514" y="503" text-anchor="middle" class="badge">GRENZE</text>
<text x="1104" y="504" class="box-head">LLM-Kontextfenster &amp; Sprachnuancen in Stufe B/C</text>
<text x="1104" y="523" class="box-code">SYSTEM_LIMITS.md · Grenze L5 &amp; L6</text>
<text x="1104" y="543" class="box-text">• Sehr große Korpora (&gt;80 lange Dateien) können trotz kompaktem</text>
<text x="1104" y="561" class="box-text">  JSON-Handoff das Kontextfenster kleiner lokaler Modelle füllen</text>
<text x="1104" y="579" class="box-text">• Kleinere Modelle (z.B. 4B) übersehen teils implizite Ironie</text>
<text x="1104" y="597" class="box-text">  oder mehrdeutige Fragebogen-Polung -&gt; epistemische Warnflags</text>
<rect x="1090" y="650" width="464" height="144" class="box-rose" />
<rect x="1472" y="661" width="70" height="20" rx="5" fill="#e11d48" />
<text x="1507" y="675" text-anchor="middle" class="badge">AUSBLICK</text>
<text x="1104" y="676" class="box-head">Lokale Einzel-/Zweitprüfung vs. Echtzeit-Multi-User</text>
<text x="1104" y="695" class="box-code">SYSTEM_LIMITS.md · Grenze L7 (Deployment)</text>
<text x="1104" y="715" class="box-text">• Unterstützt Einzelprüfung sowie 1- &amp; 2-Rechner-Zweitprüfung lokal</text>
<text x="1104" y="733" class="box-text">• Für gleichzeitigen Echtzeit-Mehrbenutzer-Server: Worker-Queue</text>
<text x="1104" y="751" class="box-text">  (Redis) + PostgreSQL + ReviewerIdentityProvider-SSO anbinden</text>
</svg>
